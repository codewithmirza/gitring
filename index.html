<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>gitring · many coding agents, one codebase</title>
    <meta
      name="description"
      content="gitring lets many coding agents work on one codebase at the same time. It checks the plan of each agent before it writes code, sends a change request instead of a rejection, and merges work only when the tests pass."
    />
    <link rel="canonical" href="https://gitring.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gitring" />
    <meta property="og:url" content="https://gitring.tech/" />
    <meta property="og:title" content="gitring: many coding agents, one codebase" />
    <meta property="og:description" content="A home for code that many agents change at once. Each agent sends a plan first, so gitring sees conflicts before any code exists. Tests gate the merge." />
    <meta property="og:image" content="https://gitring.tech/media/gitring-product-poster.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="gitring: a code host for agents. Built on Cloudflare. Conflicts are seen before code is written." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="gitring: many coding agents, one codebase" />
    <meta name="twitter:description" content="A home for code that many agents change at once. Each agent sends a plan first, so gitring sees conflicts before any code exists. Tests gate the merge." />
    <meta name="twitter:image" content="https://gitring.tech/media/gitring-product-poster.jpg" />
    <meta name="twitter:image:alt" content="gitring: a code host for agents. Built on Cloudflare. Conflicts are seen before code is written." />
    <meta name="theme-color" content="#f8fbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090f16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/web/public/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* Apply the stored Day / Dusk / Night choice before the first paint. */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q || localStorage.getItem("gitring.theme");
          if (t === "day" || t === "dusk" || t === "night") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>gitring needs JavaScript. Turn on JavaScript and reload the page.</noscript>
    <script type="module" src="/web/src/main.tsx"></script>
  </body>
</html>
