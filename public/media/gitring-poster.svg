<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Two agents work on one codebase at the same time. gitring sends one agent a change request. The work of both agents merges into main.">
  <rect width="1280" height="720" fill="#0f1a24"/>
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M140 520 C 200 520, 200 180, 260 180 H 940 C 1000 180, 1010 520, 1070 520" stroke="#6fb0c4"/>
    <path d="M230 520 C 280 520, 280 350, 330 350 H 600 C 650 350, 660 520, 710 520" stroke="#8fc58b"/>
    <path d="M60 520 H 1220" stroke="#c9d6de"/>
  </g>
  <g fill="#0f1a24" stroke-width="5">
    <circle cx="380" cy="350" r="9" stroke="#8fc58b"/><circle cx="520" cy="350" r="9" stroke="#8fc58b"/>
    <circle cx="330" cy="180" r="9" stroke="#6fb0c4"/><circle cx="780" cy="180" r="9" stroke="#6fb0c4"/><circle cx="900" cy="180" r="9" stroke="#6fb0c4"/>
  </g>
  <path d="M600 160 L620 180 L600 200 L580 180 Z" fill="#e58ab0"/>
  <g fill="#c9d6de" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">
    <text x="540" y="140" fill="#e58ab0">change request</text>
    <text x="60" y="580">main</text>
    <text x="700" y="590" fill="#8fc58b">tests pass, merged into main</text>
  </g>
  <g fill="#c9d6de" font-family="system-ui, Segoe UI, sans-serif">
    <text x="640" y="660" font-size="40" text-anchor="middle" font-weight="600">gitring</text>
  </g>
</svg>
